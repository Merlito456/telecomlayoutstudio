<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4"/>

  <!-- CAD Grid Pattern inside -->
  <path d="M64 128 H448 M64 192 H448 M64 256 H448 M64 320 H448 M64 384 H448 M128 64 V448 M192 64 V448 M256 64 V448 M320 64 V448 M384 64 V448" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Concrete Basepad Foundation Slab -->
  <rect x="110" y="350" width="292" height="42" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  <rect x="116" y="344" width="280" height="12" rx="3" fill="#64748b" opacity="0.9"/>

  <!-- Telecom Tower Lattice (Central Mast) -->
  <!-- Legs -->
  <line x1="256" y1="96" x2="176" y2="344" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="96" x2="336" y2="344" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <!-- Cross Bracing -->
  <line x1="236" y1="158" x2="276" y2="158" stroke="#0284c7" stroke-width="4.5"/>
  <line x1="216" y1="220" x2="296" y2="220" stroke="#0284c7" stroke-width="5"/>
  <line x1="196" y1="282" x2="316" y2="282" stroke="#0284c7" stroke-width="5.5"/>
  <!-- Diagonal Lattice Ties -->
  <line x1="236" y1="158" x2="296" y2="220" stroke="#38bdf8" stroke-width="3.5" opacity="0.8"/>
  <line x1="276" y1="158" x2="216" y2="220" stroke="#38bdf8" stroke-width="3.5" opacity="0.8"/>
  <line x1="216" y1="220" x2="316" y2="282" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
  <line x1="296" y1="220" x2="196" y2="282" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>

  <!-- Antenna Mast Beacon & Spire -->
  <line x1="256" y1="56" x2="256" y2="96" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="54" r="7" fill="#ef4444"/>

  <!-- Cellular Sector Antennas -->
  <rect x="206" y="112" width="12" height="34" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="294" y="112" width="12" height="34" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <circle cx="256" cy="180" r="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>

  <!-- RF Waves Radiation Arc -->
  <path d="M192 100 A90 90 0 0 0 170 144" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M320 100 A90 90 0 0 1 342 144" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Equipment Cabinets on Pad -->
  <rect x="134" y="278" width="46" height="66" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
  <line x1="157" y1="284" x2="157" y2="338" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="332" y="278" width="46" height="66" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
  <line x1="355" y1="284" x2="355" y2="338" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Horizontal Cable Ladder Bridge on Top of Basepad -->
  <rect x="180" y="332" width="152" height="12" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="202" y1="332" x2="202" y2="344" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="226" y1="332" x2="226" y2="344" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="250" y1="332" x2="250" y2="344" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="274" y1="332" x2="274" y2="344" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="298" y1="332" x2="298" y2="344" stroke="#cbd5e1" stroke-width="2"/>
</svg>
